name: build-fork-image

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
    - 'starlark'

jobs:
  build_oot_starlark:
    name: Build and push out-of-tree starlark image to GHCR
    if: github.repository != 'metal3-io/baremetal-operator'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Builds stock BMO at the pin and the plugin against that source, load tests
    # the .so, and layers it onto the operator image.
    - name: Build out of tree starlark image
      run: make -C out-of-tree image
      env:
        REGISTRY: ghcr.io/${{ github.repository_owner }}
        IMG_TAG: ${{ github.ref_name }}
        ARCH: amd64

    - name: Push image
      run: make -C out-of-tree push
      env:
        REGISTRY: ghcr.io/${{ github.repository_owner }}
        IMG_TAG: ${{ github.ref_name }}
        ARCH: amd64
