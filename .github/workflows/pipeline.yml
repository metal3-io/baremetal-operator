name: E2E Test pipeline

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    branches:
    - 'main'
    - 'release-*'
    paths-ignore:
    - '**/*.md'
    - 'docs/**'
    - '.gitignore'
    - 'LICENSE'
    - 'SECURITY_CONTACTS'
    - 'DCO'
    - 'OWNERS'

permissions: {}

jobs:

  e2e-fixture-test:
    uses: ./.github/workflows/e2e-fixture-test.yml

  e2e-test:
    strategy:
      # Avoid wasting CI resources
      fail-fast: true
      matrix:
        bmc-protocol:
        - redfish-virtualmedia
        - ipmi
    uses: ./.github/workflows/e2e-test.yml
    with:
      bmc-protocol: ${{ matrix.bmc-protocol }}

  # The provisioner is chosen per deployment, so anaconda needs its own BMO
  # and cannot share a lane with the tests above.
  e2e-anaconda-test:
    uses: ./.github/workflows/e2e-test.yml
    with:
      bmc-protocol: redfish-virtualmedia
      e2e-conf-file: test/e2e/config/anaconda.yaml
      ginkgo-focus: Anaconda
      artifact-suffix: -anaconda
