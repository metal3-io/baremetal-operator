name: unit

on:
  workflow_call:


permissions: {}

jobs:
  unit-tests:
    name: unit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Calculate go version
      id: vars
      run: echo "go_version=$(make go-version)" >> $GITHUB_OUTPUT
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ steps.vars.outputs.go_version }}
    - name: Build provisioner plugins
      run: make ironic-plugin demo-plugin anaconda-plugin
    - name: Run unit tests
      run: make -e unit-cover
      env:
        TEST_FLAGS: "-v"
    # Its own module, so make unit-cover does not reach it. No coverage here
    # either, -cover makes plugin.Open fail the package version check.
    - name: Run anaconda plugin unit tests
      run: make -e unit-anaconda
      env:
        TEST_FLAGS: "-v"
    - name: Install libvirt-dev
      run: sudo apt-get update && sudo apt-get install -y libvirt-dev
    - name: Run vbmctl unit tests
      run: make -e unit-vbmctl
      env:
        TEST_FLAGS: "-v"
