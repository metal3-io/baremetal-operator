# Kube API Linter (KAL) configuration for the v1beta1 API.
#
# Run with `make kube-api-lint`. This uses a custom golangci-lint binary that
# includes the KAL plugin (see hack/tools/.custom-gcl.yml).

version: "2"

run:
  go: "1.24"
  allow-parallel-runners: true

linters:
  default: none
  enable:
  - kubeapilinter
  settings:
    custom:
      kubeapilinter:
        type: module
        description: Kube API Linter lints Kubernetes-like APIs based on API conventions and best practices.
        settings:
          linters:
            disable:
            - "*"
            enable:
            - commentstart
            - conditions
            - defaultorrequired
            - defaults

            - duplicatemarkers
            - integers
            - jsontags
            - nodurations
            - nomaps
            - nophase
            - notimestamp
            - optionalorrequired # Every field should be marked as `+optional` or `+required`.
            - requiredfields
            - statussubresource
            - uniquemarkers
          lintersConfig:
            conditions:
              isFirstField: Warn # Require conditions to be the first field in the status struct.
              usePatchStrategy: Forbid # Forbid patchStrategy markers on the Conditions field.
              useProtobuf: Forbid # We don't use protobuf, so protobuf tags are not required.
  exclusions:
    rules:
    # TODO: Fix these fields to satisfy requiredfields (pointers, omitempty, complete validation).
    - path: metal3.io/v1beta1/baremetalhost_types.go
      linters:
      - kubeapilinter
      text: "requiredfields: field (BMCDetails\\.(Address|CredentialsName)|(Hardware|Software)RAIDVolume\\.Level|SwitchPortIdentifier\\.(SwitchID|PortID)|SwitchPortConfig\\.(Mode|NativeVLAN)|NetworkInterface\\.HostNetworkAttachment|BareMetalHostSpec\\.PoweredOn|Image\\.URL|CustomDeploy\\.Method|RebootAnnotationArguments\\.(Mode|Force)|AppliedNetworkAttachmentConfig\\.(Name|MACAddress|SwitchPortConfig)|BareMetalHostStatus\\.(OperationalStatus|Provisioning|ErrorMessage|PoweredOn)|ProvisionStatus\\.(State|ID)) "

issues:
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0
