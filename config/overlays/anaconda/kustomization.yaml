apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../namespace
- ../../default
- ./service.yaml

patches:
- patch: |
    # Load the out-of-tree anaconda plugin instead of ironic
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --provisioner=anaconda
    # The kickstart and callback listener, named so the Service can target it
    - op: add
      path: /spec/template/spec/containers/0/ports/-
      value:
        containerPort: 9080
        protocol: TCP
        name: anaconda
    # Don't try to pull again the pre-loaded image
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
    # BMO is the Redfish client here and the BMC is on the node's network
    - op: add
      path: /spec/template/spec/hostNetwork
      value: true
    # Host networking alone would drop cluster DNS
    - op: add
      path: /spec/template/spec/dnsPolicy
      value: ClusterFirstWithHostNet
  target:
    kind: Deployment
    name: controller-manager

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: ironic
  behavior: merge
  literals:
  # Not loopback, the curl pod has to reach it from outside the manager pod
  - ANACONDA_LISTEN_ADDR=0.0.0.0:9080
  - ANACONDA_BASE_URL=http://baremetal-operator-anaconda.baremetal-operator-system.svc.cluster.local:9080
  # Short so ShutDownAfterInstall cuts power if the guest ignores the shutdown
  - ANACONDA_INSTALL_TIMEOUT=5m

images:
- name: quay.io/metal3-io/baremetal-operator
  newTag: e2e-anaconda
