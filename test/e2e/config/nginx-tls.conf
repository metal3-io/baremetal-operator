# nginx configuration for the vbmctl image server used in e2e tests.
#
# This file replaces the container's default /etc/nginx/conf.d/default.conf
# (mounted via spec.imageServer.extraMounts in vbmctl.yaml.tmpl, see
# hack/ci-e2e.sh) to add an HTTPS listener alongside the default plain-HTTP
# one. The certificate/key pair is generated by hack/ci-e2e.sh using openssl
# and mounted the same way. This lets Ironic's ramdisk-downloader init
# container fetch the IPA kernel/ramdisk over HTTPS instead of plain HTTP
# (see test/e2e/README.md for the full picture, and test/vbmctl/README.md for
# other uses of extraMounts/extraPorts).
server {
    listen       8080;
    listen       [::]:8080;
    server_name  localhost;

    location / {
        root /usr/share/nginx/html;
    }
}

server {
    listen       8443 ssl;
    listen       [::]:8443 ssl;
    server_name  localhost;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    location / {
        root /usr/share/nginx/html;
    }
}
