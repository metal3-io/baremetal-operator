apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: baremetal-operator-system

resources:
- ../../base

components:
- ../../../components/tls
- ../../../components/basic-auth
- ../../../components/upgrade-ip
- ../../../components/trusted-ca

patches:
- target:
    kind: Ironic
    name: ironic
  patch: |-
    - op: replace
      path: /spec/version
      value: "35.0"
    # Override the ipa-insecure kernel parameter (set in base) back to the default value of 1.
    # This is needed since IrSO v0.9 (used together with this overlay in the
    # 33.0 -> 35.0 upgrade test) does not set IRONIC_CACERT_FILE from the ca.crt of the TLS secret.
    - op: replace
      path: /spec/deployRamdisk/extraKernelParams
      value: "console=ttyS0 bmo-e2e-kernel-params-ok ipa-insecure=1"
